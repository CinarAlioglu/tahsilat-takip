name: Derle ve test et

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Testler
        run: dotnet test tests/TahsilatTakip.Tests -c Release

      - name: Uygulamayı paketle (tek dosya, .NET kurulumu gerektirmez)
        run: >
          dotnet publish src/TahsilatTakip.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: TahsilatTakip-win-x64
          path: publish/
          retention-days: 30
